# Production stack, run by the Forge deploy script:
#   docker compose -f compose.prod.yml up -d --build
# Values come from the site's .env, which Forge manages.

x-app: &app
    build: .
    image: tarjetero:latest
    restart: unless-stopped
    env_file: .env
    environment:
        LOG_CHANNEL: stderr
    volumes:
        - storage:/app/storage/app
    depends_on:
        mariadb:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    app:
        <<: *app
        ports:
            # Only the host's nginx can reach it
            - '127.0.0.1:${APP_PORT:-8080}:8080'

    worker:
        <<: *app
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']
        # The image's healthcheck probes Caddy, which only runs in app
        healthcheck:
            disable: true

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        # The image's healthcheck probes Caddy, which only runs in app
        healthcheck:
            disable: true

    mariadb:
        image: 'mariadb:10.11'
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}'
            MARIADB_DATABASE: '${DB_DATABASE}'
            MARIADB_USER: '${DB_USERNAME}'
            MARIADB_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
        volumes:
            - mariadb:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 10s
            retries: 5

    redis:
        image: 'redis:8.4-alpine'
        restart: unless-stopped
        command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}', '--appendonly', 'yes']
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
            interval: 10s
            retries: 5
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD}'

volumes:
    storage:
    mariadb:
    redis:
